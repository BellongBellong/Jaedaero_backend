app.environment=local
batch.daily-refresh.enabled=false

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
db.username=${MYSQL_USER}
db.password=${MYSQL_PASSWORD}

# 시연 환경에서는 소셜 로그인으로 시연 사용자를 생성·로그인할 수 있어야 합니다.
google.client-id=${GOOGLE_CLIENT_ID:}
google.client-secret=${GOOGLE_CLIENT_SECRET:}
kakao.client-id=${KAKAO_CLIENT_ID:}
kakao.client-secret=${KAKAO_CLIENT_SECRET:}

# CODEF를 호출하지 않는 부하 테스트에서도 OAuth 클라이언트 빈 생성에 두 값이 필요합니다.
codef.client-id=${CODEF_CLIENT_ID}
codef.client-secret=${CODEF_CLIENT_SECRET}
app.crypto.master-key-base64=${APP_CRYPTO_MASTER_KEY_BASE64}
krx.api.auth-key=${KRX_API_AUTH_KEY:}
