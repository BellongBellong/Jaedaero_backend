name: Deploy to EC2 via SSM

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: jaedaero-production-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Debug OIDC claims
        run: |
          TOKEN="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')"

          export TOKEN
          python - <<'PY'
          import base64, json, os

          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print(json.dumps({
              "aud": claims.get("aud"),
              "sub": claims.get("sub"),
              "repository": claims.get("repository"),
              "ref": claims.get("ref"),
              "environment": claims.get("environment")
          }, indent=2))
          PY

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run deployment on EC2
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          cat > ssm-commands.json <<'EOF'
          {
            "commands": [
              "set -eu",
              "runuser -u ubuntu -- git -C /opt/jaedaero/app fetch origin dev",
              "runuser -u ubuntu -- git -C /opt/jaedaero/app checkout -B dev origin/dev",
              "cd /opt/jaedaero/app",
              "docker compose -f docker-compose.prod.yml up -d --build --remove-orphans",
              "docker compose -f docker-compose.prod.yml ps",
              "for attempt in $(seq 1 24); do if curl --fail --silent --show-error --location http://127.0.0.1:8080/swagger-ui.html > /dev/null; then exit 0; fi; sleep 5; done",
              "docker compose -f docker-compose.prod.yml logs --tail=100 backend",
              "exit 1"
            ]
          }
          EOF

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-commands.json \
            --comment "Deploy Jaedaero backend from dev" \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          aws ssm wait command-executed \
            --command-id "$command_id" \
            --instance-id "$INSTANCE_ID"

      - name: Print deployment output
        if: always()
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          if [ -n "$COMMAND_ID" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json
          fi
