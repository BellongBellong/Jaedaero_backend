name: Deploy to EC2 via SSM

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: jaedaero-production-deploy
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: jaedaero-backend

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # SSM이 전달을 재시도하는 시간과 Docker 이미지 빌드 시간을 고려한다.
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          TOKEN="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')"

          export TOKEN
          python - <<'PY'
          import base64, json, os

          payload = os.environ["TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print(json.dumps({
              "aud": claims.get("aud"),
              "sub": claims.get("sub"),
              "repository": claims.get("repository"),
              "ref": claims.get("ref"),
              "environment": claims.get("environment")
          }, indent=2))
          PY

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run deployment on EC2
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          cat > ssm-commands.json <<EOF
          {
            "commands": [
              "set -eu",
              "runuser -u ubuntu -- git -C /opt/jaedaero/app fetch origin dev",
              "runuser -u ubuntu -- git -C /opt/jaedaero/app checkout -B dev origin/dev",
              "cd /opt/jaedaero/app",
              "aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${ECR_REGISTRY}",
              "BACKEND_IMAGE=${BACKEND_IMAGE} docker compose -f docker-compose.prod.yml pull backend",
              "BACKEND_IMAGE=${BACKEND_IMAGE} docker compose -f docker-compose.prod.yml up -d --remove-orphans",
              "docker compose -f docker-compose.prod.yml ps",
              "for attempt in \$(seq 1 24); do if curl --fail --silent --show-error --location http://127.0.0.1:8080/swagger-ui.html > /dev/null; then docker image prune -f; exit 0; fi; sleep 5; done",
              "docker compose -f docker-compose.prod.yml logs --tail=100 backend",
              "exit 1"
            ]
          }
          EOF

          command_id="$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-commands.json \
            --comment "Deploy Jaedaero backend from dev" \
            --timeout-seconds 1800 \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          # `aws ssm wait command-executed`는 약 100초만 기다린다.
          # SSM Agent가 일시적으로 명령 수신을 지연하면 실제 배포 전에도
          # GitHub Actions가 실패할 수 있으므로 최대 30분까지 상태를 직접 확인한다.
          for attempt in $(seq 1 180); do
            if ! invocation="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --output json 2>&1)"; then
              echo "[$attempt/180] SSM 실행 상태를 아직 조회할 수 없습니다. 10초 후 재시도합니다."
              sleep 10
              continue
            fi

            status="$(jq -r '.Status' <<< "$invocation")"
            details="$(jq -r '.StatusDetails' <<< "$invocation")"
            echo "[$attempt/180] SSM command status: $status ($details)"

            case "$status" in
              Success)
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling|Undeliverable|Terminated)
                echo "$invocation"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "SSM 명령이 30분 안에 완료되지 않았습니다."
          exit 1

      - name: Print deployment output
        if: always()
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          if [ -n "$COMMAND_ID" ]; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --output json
          fi
