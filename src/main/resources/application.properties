# 공용 비밀정보가 아닌 설정만 둡니다.
app.name=jaedaero
app.environment=local

# CODEF OAuth 엔드포인트입니다. 자격 증명은 application-local.properties에만 둡니다.
codef.oauth.token-url=https://oauth.codef.io/oauth/token
codef.oauth.timeout-seconds=30
codef.api.base-url=https://development.codef.io

# KRX Open API는 ETF 기능에서만 사용한다. 인증키는 application-local.properties에 둔다.
krx.api.base-url=https://data-dbg.krx.co.kr

# 금융위원회_지수시세정보. KOSPI/KOSDAQ 시장 리포트 수집용 서비스키는 local 설정에 둔다.
market-index.api.base-url=https://apis.data.go.kr/1160100/service/GetMarketIndexInfoService

# 한국수출입은행 Open API. 인증키는 application-local.properties의 eximbank.api.key.
eximbank.api.base-url=https://oapi.koreaexim.go.kr

# FRED DGS10 미국채 10년물 관측값. 인증키는 application-local.properties의 fred.api.key.
fred.api.base-url=https://api.stlouisfed.org

# Finnhub Market News. 인증키는 application-local.properties의 finnhub.api.key.
finnhub.api.base-url=https://finnhub.io

# Gemini Developer API generateContent. 키는 application-local.properties에서만 설정한다.
gemini.generate-content-url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent
gemini.connect-timeout-ms=10000
gemini.read-timeout-ms=90000
gemini.max-attempts=4
gemini.retry-initial-delay-ms=1500

# 알림 런타임 값과 비밀정보는 Docker .env 환경변수로 주입한다.
# FCM_ENABLED=false이면 Outbox 발행은 유지하고 FCM Consumer만 정지한다.
