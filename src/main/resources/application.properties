# 공용 비밀정보가 아닌 설정만 둡니다.
app.name=jaedaero
app.environment=local

# CODEF OAuth 엔드포인트입니다. 자격 증명은 application-local.properties에만 둡니다.
codef.oauth.token-url=https://oauth.codef.io/oauth/token
codef.oauth.timeout-seconds=30
codef.api.base-url=https://development.codef.io

# KRX Open API 키는 application-local.properties에만 둡니다.
krx.api.base-url=https://data-dbg.krx.co.kr
