services:
  mysql:
    image: mysql:8.4
    container_name: jaedaero-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./jaedaero_db_v1.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./sql/seed/military_pay_policy.sql:/docker-entrypoint-initdb.d/02-military-pay-policy.sql:ro
      - ./sql/seed/badge_policy.sql:/docker-entrypoint-initdb.d/03-badge-policy.sql:ro
      - ./sql/seed/challenge_mission_mock_data.sql:/docker-entrypoint-initdb.d/04-challenge-missions.sql:ro
      - ./sql/migration/20260818_add_leave_benefits.sql:/docker-entrypoint-initdb.d/05-add-leave-benefits.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: .
    image: jaedaero-backend:latest
    container_name: jaedaero-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/jaedaero/config/application-local.properties:/run/secrets/application-local.properties:ro

volumes:
  mysql_data:
